<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="token" content="__TOKEN__">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'">
  <title>Shortcut Dock icons</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section id="grid" aria-label="Dock keys"></section>

    <aside>
      <h2 id="selTitle">Key 1</h2>
      <button id="choose">Choose image…</button>
      <input type="file" id="file" accept="image/*" hidden>
      <button id="clearKey">Clear key</button>
      <label><input type="checkbox" id="flipH"> Flip left-right</label>
      <label><input type="checkbox" id="flipV"> Flip top-bottom</label>
      <label>Caption (max 12 chars)
        <input type="text" id="caption" maxlength="12">
      </label>
      <button id="applyKey" class="primary">Apply this key</button>
      <button id="applyAll" class="primary">Apply ALL to dock</button>

      <h3>Settings</h3>
      <label>Panel rotation fix
        <select id="rotation">
          <option value="0">0°</option>
          <option value="90">90°</option>
          <option value="180">180°</option>
          <option value="270">270°</option>
        </select>
      </label>
      <label>Key numbering
        <select id="numbering"></select>
      </label>
      <label>Brightness <output id="briVal"></output>
        <input type="range" id="brightness" min="0" max="100">
      </label>
      <button id="showNumbers">Show key numbers on dock</button>
      <button id="reconnect">Reconnect</button>
    </aside>
  </main>
  <footer id="status">Starting…</footer>
  <script src="app.js"></script>
</body>
</html>
